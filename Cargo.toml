[workspace]
resolver = "2"
members = [
    "crates/silo-core",
    "crates/silo-vault",
    "crates/silo-index",
    "crates/silo-markdown",
    "crates/silo-ui",
    "app/silo",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
pulldown-cmark = "0.12"
ulid = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3"
insta = "1"
# GPUI has no crates.io release. Pinned to a specific Zed revision (recorded in
# CLAUDE.md). GPUI's API is not semver-stable; reconcile against this rev's examples.
gpui = { git = "https://github.com/zed-industries/zed", rev = "82aef44308540b576e4e51fb379efa71614e5c91" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "82aef44308540b576e4e51fb379efa71614e5c91" }

# GPUI's async executor pulls Zed's forks of these; replicate the relevant
# [patch.crates-io] entries from Zed's workspace so the git dependency resolves.
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
